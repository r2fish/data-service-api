# Makes `pytest tools/tests` resolve `tools/tests/` itself as pytest's
# rootdir. pytest's default confcutdir (the upward boundary of conftest.py
# search) is that same rootdir, so this file is what stops the repository
# root `conftest.py` (and its throwaway-PostgreSQL-cluster startup) from
# being imported for a suite that never touches PostgreSQL at all (design
# docs/design/TEST_POSTGRES_ISOLATION_V0_1.md v0.2 D-1, review finding
# M-1). Work order docs/work-orders/WORK_ORDER_R44_TEST_PG_ISOLATION_V1.md
# §2.3.
#
# filterwarnings: the same two entries as the repository-root pyproject.toml
# and both peers' pyproject.toml (conformance-tests/
# test_pytest_config_symmetry.py pins those three; this file is a fourth,
# independent root and is not part of that symmetry check, but carries the
# same policy so a DeprecationWarning here is not silently downgraded).
[pytest]
filterwarnings =
    error::DeprecationWarning
    ignore:.*BlockingPortal.*:DeprecationWarning:starlette.testclient
