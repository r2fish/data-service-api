repos:
  - repo: local
    hooks:
      - id: public-value-scan
        name: public value scan (no real hostnames/e-mail/project ids/credential_id/IAM/absolute paths/secrets)
        description: >-
          Machine enforcement of docs/security/public-repository-policy.md.
          Standard-library-only script (tools/public_value_scan.py); no
          external repository dependency (see design D-2, rejecting
          gitleaks/trufflehog).
        entry: python3 tools/public_value_scan.py
        language: system
        pass_filenames: true
        types: [text]

      - id: check-doc-refs
        name: check document ID references (every ID reference resolves to a definition in its canonical file)
        description: >-
          Machine enforcement of docs/design/DEVELOPMENT_PROCESS_HYGIENE_V1.md
          D-2. Standard-library-only script (tools/check_doc_refs.py);
          whole-repo scan, so it does not take per-file arguments from
          pre-commit (unlike public-value-scan above).
        entry: python3 tools/check_doc_refs.py
        language: system
        pass_filenames: false
        always_run: true

      - id: ledger-check
        name: ledger fixed-field check (section 8 tables and the closed-row archive agree)
        description: >-
          Machine enforcement of docs/design/LEDGER_FIXED_FIELDS_V1.md D-8.
          Standard-library-only script (tools/dev/ledger.py --check);
          whole-repo, so it does not take per-file arguments from pre-commit.
        entry: python3 tools/dev/ledger.py --check
        language: system
        pass_filenames: false
        always_run: true
