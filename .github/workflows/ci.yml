# Common-evidence CI for the Data Service API contract's two peer
# implementations (r2db-api, MitateDB-api).
#
# Design: docs/design/PHASE7_EVIDENCE_REPRODUCIBILITY_AND_PUBLICATION_V1.md
# D-3. Work order: docs/work-orders/WORK_ORDER_PHASE7_EVIDENCE_AND_
# PUBLICATION_V1.md WP-2.
#
# Python matrix (requester ruling 2026-09-05, design section 6 (alpha)):
# 3.11 and 3.12 are BOTH required -- 3.11 is the recording environment for
# the authoritative pass/failed/skipped/xfailed tally (it also matches
# MitateDB's container base image, python:3.11-slim); 3.12 matches r2db's
# VPS runtime. Neither job carries `continue-on-error`, so a failure in
# either one fails the workflow. The `tally-consistency` job below is the
# mechanism that makes the 3.12 job additionally guarantee it reproduced
# the SAME tally as 3.11 -- the 3.11 job's tally remains the one
# authoritative record (also documented in conformance-tests/README.md).
#
# Requester ruling 2026-09-08 (Actions spend: 38 runs on 2026-09-08 alone,
# ~20 billable minutes each, against a 2,000-minute monthly allowance):
# the 3.12 reproduction and the `tally-consistency` comparison run ONLY on
# `main`. A push to any other branch runs the 3.11 job alone, so a branch
# still gets the authoritative gate but not the second copy. Every branch
# reaches `main` by merge, and that push runs both jobs plus the tally
# comparison, so nothing lands on `main` without the 3.12 reproduction.
# This is exactly the alternative that design DEVELOPMENT_PROCESS_HYGIENE_V1.md
# D-4 rejected as (2) on 2026-09-07 for want of a ruling; v1.6 records the
# ruling. The `python-version` matrix below is therefore an expression.
#
# PostgreSQL 16 is started with a dedicated `docker run` step, not a
# `services:` container: `services.<id>` only accepts `image` / `credentials`
# / `env` / `ports` / `volumes` / `options` -- there is no key that passes
# command-line arguments to the container's entrypoint, so `max_connections`
# would stay at Postgres's default of 100 and the gate's `-n 5` concurrent
# adapters would exhaust connections. `docker run` passes `-c
# max_connections=300` directly as a command argument to `postgres:16`.
#
# Change-class gating (design docs/design/DEVELOPMENT_PROCESS_HYGIENE_V1.md
# D-4): the `change-class` job below classifies this push's changed paths
# with `tools/change_class.py` (roadmap docs/design/ROADMAP_POST_PHASE7_V1.md
# section 9 item 8's A/B/C/D table, applied as a path-only floor) and the
# `conformance` / `tally-consistency` jobs run only when that classification
# is not Class A (docs-only) -- a push it cannot classify (an empty diff, an
# unreachable `before`, or `workflow_dispatch`) is always treated as
# conformance-required, never skipped. `scanner` and `deploy-assets-lint` are
# unaffected and always run, and the document-ID-reference check now lives in
# its own always-run `doc-refs` job rather than as a step inside `conformance`
# (previously duplicated once per Python-version matrix entry).
name: CI

# Least-privilege default token scope (no job needs to write anything).
permissions:
  contents: read

# One concurrent run per branch/ref: a new push cancels whatever is
# already running for the same ref instead of racing it for the shared
# real-PostgreSQL completion gate.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Trigger is supervisor ruling 2026-09-05: `push` on every branch only.
# `pull_request` is deliberately not a trigger -- this is a single-worker
# repository with no PR workflow, and the supervisor measures mutations by
# pushing to a branch directly; keeping `pull_request` would double-run
# the same commit for no reader.
"on":
  push:
  workflow_dispatch:

# Real values are never written to this file. The PostgreSQL password below
# is a synthetic, CI-local, ephemeral value for a container that lives only
# for the duration of one job run -- not a credential of any real system.
# It is duplicated (rather than composed via an expression) into the two
# DSN variables below because the `env` context cannot reliably reference
# a sibling key defined in the same `env:` mapping.
env:
  CI_SYNTHETIC_PG_PASSWORD: "ci-only-ephemeral-not-a-real-secret"
  # Both variables default to a unix-socket DSN (host=/tmp) when unset,
  # which does not reach a server published on a loopback TCP port --
  # both must be overridden here (design D-3; conformance-tests/
  # README.md "Running against real PostgreSQL").
  R2DB_TEST_ADMIN_DSN: "host=127.0.0.1 port=5432 dbname=postgres user=postgres password=ci-only-ephemeral-not-a-real-secret"
  MITATEDB_TEST_ADMIN_DSN: "host=127.0.0.1 port=5432 dbname=postgres user=postgres password=ci-only-ephemeral-not-a-real-secret"

jobs:
  change-class:
    name: change class (design DEVELOPMENT_PROCESS_HYGIENE_V1.md D-4)
    runs-on: ubuntu-latest
    outputs:
      class: ${{ steps.classify.outputs.class }}
      conformance_required: ${{ steps.classify.outputs.conformance_required }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is required: the classification below diffs
          # against `github.event.before`, which can be arbitrarily far
          # back on a branch with a long history.
          fetch-depth: 0

      - name: Classify this push's changed paths
        id: classify
        run: |
          BEFORE="${{ github.event.before }}"
          SHA="${{ github.sha }}"
          ZERO="0000000000000000000000000000000000000000"

          # Safe-side default (design D-4): a push this job cannot get a
          # real diff for is never treated as "nothing changed" -- it is
          # `unknown`/conformance-required, exactly like tools/change_class.py's
          # own empty-input behavior. Three cases are undiffable here:
          #   - `workflow_dispatch` carries no `before`/`sha` push pair at all;
          #   - `before` is all-zero (a brand-new branch's first push);
          #   - `before` is not an ancestor of `sha` (a force push that
          #     rewrote history out from under the branch).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$BEFORE" = "$ZERO" ] || ! git merge-base --is-ancestor "$BEFORE" "$SHA"; then
            RESULT="$(printf '' | python3 tools/change_class.py)"
          else
            RESULT="$(git diff --name-only --no-renames "$BEFORE" "$SHA" | python3 tools/change_class.py)"
          fi

          echo "$RESULT"

          CLASS="$(echo "$RESULT" | grep '^class=' | cut -d= -f2)"
          REQUIRED="$(echo "$RESULT" | grep '^conformance_required=' | cut -d= -f2)"
          echo "class=$CLASS" >> "$GITHUB_OUTPUT"
          echo "conformance_required=$REQUIRED" >> "$GITHUB_OUTPUT"

          {
            echo "### Change class: $CLASS (conformance_required=$REQUIRED)"
            echo ""
            echo '```'
            echo "$RESULT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  conformance:
    name: conformance (Python ${{ matrix.python-version }})
    needs: change-class
    if: needs.change-class.outputs.conformance_required == 'true'
    runs-on: ubuntu-latest
    # Phase 8 WP-1 review finding 3: a broken hold_in_flight premise hangs
    # rather than fails; bound the whole job so the hang surfaces as red.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Requester ruling 2026-09-08 (file header): 3.12 only on `main`.
        python-version: ${{ fromJSON(github.ref == 'refs/heads/main' && '["3.11", "3.12"]' || '["3.11"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: "Start PostgreSQL 16 (docker run, not services: -- see file header)"
        run: |
          docker run -d --name pg16 \
            -e POSTGRES_PASSWORD="$CI_SYNTHETIC_PG_PASSWORD" \
            -p 127.0.0.1:5432:5432 \
            postgres:16 -c max_connections=300

      - name: Wait for PostgreSQL to accept connections
        run: |
          for i in $(seq 1 60); do
            if docker exec pg16 pg_isready -U postgres -h 127.0.0.1 >/dev/null 2>&1; then
              echo "PostgreSQL is ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "PostgreSQL did not become ready within 60s" >&2
          docker logs pg16 || true
          exit 1

      - name: "Install PostgreSQL client (both adapters shell out to psql) and nginx (design D-3: required dependency of conformance-tests/socket_harness.py) -- one `apt-get update` for both (F-9 差し戻し 監督裁定 2026-09-08: the previous two separate steps each ran their own redundant `apt-get update`)"
        run: sudo apt-get update && sudo apt-get install -y postgresql-client nginx

      - name: "Stop the distro's own nginx service (design D-11 (1): Debian starts a default-conf service on install; this job's own conformance gate must be the only nginx running for the duration -- see the marker-scoped residue check below, which would NOT itself catch this distro service left running, since its own argv carries none of this harness's own `conformance-socket-harness` marker)"
        run: sudo systemctl disable --now nginx || sudo service nginx stop

      - name: Install (exact-pinned via constraints.txt)
        run: pip install -c constraints.txt -e ./r2db-api[test] -e ./MitateDB-api[test]

      - name: Check COLLECTION_FLOOR (R-9, evidence-loss detection -- design PHASE8_EFFECTIVE_BOUNDS_AND_HYGIENE_V1.md D-3)
        run: python3 tools/check_collection_floor.py

      - name: Run the common conformance gate
        run: |
          set -o pipefail
          python -m pytest -q -n 5 --dist loadgroup 2>&1 | tee pytest-output.log

      - name: "Check for leftover socket-harness process/port residue (design D-2 (f) / D-11 (2))"
        # `if: always()` -- this check matters MOST after a failed gate run
        # (a stalled test that never reached its own `.stop()`/fixture
        # teardown is exactly the residue this step exists to catch), not
        # only after a green one. Two independent checks (F-3 差し戻し,
        # 監督裁定 2026-09-08):
        #   (i) a marker-scoped `pgrep` on the harness's own literal
        #       markers (`conformance-tests/socket_harness.py`'s own
        #       `NGINX_PREFIX_MARKER`, and this WP's own subprocess-
        #       launcher self-test's probe module name) rather than a bare
        #       `pgrep nginx`/`pgrep uvicorn`, which would also match an
        #       unrelated process on this runner (design's own "prefix で
        #       スコープしない pgrep は runner の無関係なプロセスに当た
        #       る"). This alone MISSES an orphaned nginx WORKER: nginx
        #       rewrites a worker's own argv to the fixed string `nginx:
        #       worker process`, which carries no marker at all, so a
        #       killed master that leaves a worker behind is invisible
        #       here.
        #   (ii) every port `socket_harness.py::RealSocketSurface` ever
        #        recorded in one of its own `ports.json` ledgers (under
        #        `${TMPDIR:-/tmp}/conf-socket-*/conformance-socket-harness/
        #        ports.json` -- N-3 差し戻し, 監督裁定 2026-09-08: rooted
        #        at `${TMPDIR:-/tmp}`, matching Python's own `tempfile.
        #        mkdtemp(prefix="conf-socket-")` resolution order, never a
        #        bare `/tmp` that silently degrades to scanning 0 files on
        #        a runner where `TMPDIR` is set to something else) must
        #        have NO listener left on it (`ss -ltn`) -- this is what
        #        catches the orphaned-worker gap (i) leaves open,
        #        independent of any process's own argv. Finding 0 files to
        #        scan is NOT itself a failure (a run with no socket-plug
        #        test collected writes none), but it is echoed explicitly
        #        below rather than silently passing through an empty loop,
        #        so a `TMPDIR` mismatch that would otherwise degrade this
        #        check to "always green" is visible in the job log.
        if: always()
        run: |
          residue_found=0
          if pgrep -fl "conformance-socket-harness"; then
            echo "ERROR: leftover conformance-tests/socket_harness.py nginx process(es) found above" >&2
            residue_found=1
          fi
          if pgrep -fl "conf_socket_probe_app"; then
            echo "ERROR: leftover conformance-tests/socket_harness.py subprocess-uvicorn residue found above" >&2
            residue_found=1
          fi
          scan_root="${TMPDIR:-/tmp}"
          shopt -s nullglob
          ports_files=("${scan_root}"/conf-socket-*/conformance-socket-harness/ports.json)
          shopt -u nullglob
          if [ "${#ports_files[@]}" -eq 0 ]; then
            echo "No ports.json ledgers found under ${scan_root}/conf-socket-* -- 0 files to scan (not itself a failure)."
          else
            for f in "${ports_files[@]}"; do
              for port in $(python3 -c "import json; print(' '.join(str(p) for p in json.load(open('$f'))))"); do
                if ss -ltn "sport = :${port}" | grep -q ":${port}\b"; then
                  echo "ERROR: port ${port} (recorded in ${f}) still has a listener:" >&2
                  ss -ltn "sport = :${port}" >&2
                  residue_found=1
                fi
              done
            done
          fi
          if [ "$residue_found" -ne 0 ]; then
            exit 1
          fi
          echo "No socket-harness process/port residue found."

      - name: Extract pass/fail/skip/xfail tally
        if: always()
        run: |
          python3 - <<'PYEOF'
          import json
          import pathlib
          import re
          import sys

          text = pathlib.Path("pytest-output.log").read_text()
          # Candidate lines are pytest's own tally categories -- passed/
          # failed/skipped/xfailed/error(s) -- not just passed/failed/error.
          # A run that is entirely skipped or xfailed (0 passed, 0 failed)
          # produces a summary line with none of "passed"/"failed"/"error"
          # in it (e.g. "5 skipped, 2 xfailed in 1.20s"); the previous
          # narrower filter missed that line entirely.
          candidates = [
              line
              for line in text.splitlines()
              if re.search(r"\b(passed|failed|skipped|xfailed|errors?)\b", line)
          ]

          if not candidates:
              print(
                  "ERROR: no candidate pytest summary line found in "
                  "pytest-output.log (no line contains passed/failed/"
                  "skipped/xfailed/error(s))",
                  file=sys.stderr,
              )
              sys.exit(1)

          summary = candidates[-1]

          # A real pytest tally line always ends with "in <N>[.<N>]s". If
          # the last matching line does not have that shape, it is not
          # actually pytest's summary line (e.g. a stray log line that
          # happens to contain one of the words above) -- fail loudly
          # instead of silently writing an all-zero tally.
          if not re.search(r"\bin\s+\d+(?:\.\d+)?s\b", summary):
              print(
                  "ERROR: extracted line does not look like a pytest "
                  f"summary line (missing 'in <N>s'): {summary!r}",
                  file=sys.stderr,
              )
              sys.exit(1)

          def count(word: str) -> str:
              m = re.search(r"(\d+)\s+" + word, summary)
              return m.group(1) if m else "0"

          # This tally schema has no "errors" field (collection/fixture
          # errors are a different outcome from failed tests). Rather than
          # silently reporting an all-zero passed/failed/skipped/xfailed
          # tally while dropping evidence of errors on the floor, fail
          # loudly when the summary line reports any.
          error_count = count("errors?")
          if error_count != "0":
              print(
                  f"ERROR: pytest summary reports {error_count} error(s), "
                  "which this tally schema does not track -- failing "
                  f"instead of silently dropping them: {summary!r}",
                  file=sys.stderr,
              )
              sys.exit(1)

          tally = {
              "passed": count("passed"),
              "failed": count("failed"),
              "skipped": count("skipped"),
              "xfailed": count("xfailed"),
              "xpassed": count("xpassed"),
              "deselected": count("deselected"),
              "summary_line": summary,
          }
          pathlib.Path("pytest-tally.json").write_text(json.dumps(tally, indent=2))
          print(json.dumps(tally, indent=2))

          # OPERATING_CONDITIONS.md item 22: the pass condition is
          # failed = 0 / skipped = 0 / xfailed = 0 -- item 26 warns a skip
          # silently converts "unverified" into "allowed". Written above so
          # the tally artifact/job summary still records what happened
          # (`if: always()` on both later steps), but this step must not
          # let a nonzero skipped/xfailed count through as a passing gate.
          # Supervisor ruling 2026-09-08 extends the same items 22/26
          # reasoning to two more categories the summary line can carry:
          # xpassed (a test marked `xfail` actually passed -- a stale
          # xfail declaration masquerading as a documented failure) and
          # deselected (pytest's own `-k`/`-m`/`--deselect` narrowed what
          # ran, so this tally is not the whole suite and cannot stand in
          # for it).
          if (
              tally["skipped"] != "0"
              or tally["xfailed"] != "0"
              or tally["xpassed"] != "0"
              or tally["deselected"] != "0"
          ):
              print(
                  "ERROR: OPERATING_CONDITIONS.md item 22 requires "
                  "skipped == 0 and xfailed == 0; item 26 (skip converts "
                  "unverified into allowed) extends to xpassed == 0 (a "
                  "stale xfail declaration) and deselected == 0 (the "
                  "tally is not the whole suite) -- "
                  f"summary line: {summary!r}",
                  file=sys.stderr,
              )
              sys.exit(1)
          PYEOF

      - name: Write job summary (passed / failed / skipped / xfailed)
        if: always()
        run: |
          {
            echo "### Conformance gate tally -- Python ${{ matrix.python-version }}"
            echo ""
            if [ -f pytest-tally.json ]; then
              echo '```json'
              cat pytest-tally.json
              echo '```'
            else
              echo "gate failed before a tally was written"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upload tally artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-tally-${{ matrix.python-version }}
          path: pytest-tally.json

  tally-consistency:
    # The 3.11 job's tally is the authoritative record of the completion
    # gate (design section 6 (alpha)). This job's only purpose is to make
    # the 3.12 job's "required" status additionally depend on reproducing
    # that exact tally -- a mismatch fails this job, which is required.
    name: 3.11 tally is authoritative -- 3.12 must reproduce it
    needs: [change-class, conformance]
    # `main` only (requester ruling 2026-09-08, file header): on any other
    # branch the matrix has no 3.12 entry, so there is no tally to compare.
    if: needs.change-class.outputs.conformance_required == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pytest-tally-3.11
          path: tally-3.11
      - uses: actions/download-artifact@v4
        with:
          name: pytest-tally-3.12
          path: tally-3.12
      - name: Compare the 3.11 (authoritative) and 3.12 tallies
        run: |
          python3 - <<'PYEOF'
          import json
          import sys

          authoritative = json.load(open("tally-3.11/pytest-tally.json"))
          reproduced = json.load(open("tally-3.12/pytest-tally.json"))
          keys = ("passed", "failed", "skipped", "xfailed", "xpassed", "deselected")
          mismatch = {
              k: {"3.11": authoritative[k], "3.12": reproduced[k]}
              for k in keys
              if authoritative[k] != reproduced[k]
          }
          if mismatch:
              print("3.11 (authoritative) vs 3.12 tally mismatch:", mismatch)
              sys.exit(1)
          print("3.11 and 3.12 tallies match:", {k: authoritative[k] for k in keys})

          # OPERATING_CONDITIONS.md item 22: failed = 0 / skipped = 0 /
          # xfailed = 0 is the pass condition. Each matrix job's own
          # "Extract pass/fail/skip/xfail tally" step already enforces
          # this, but this job downloads and re-reads both tallies
          # independently -- checked again here so a compare-only rerun
          # against stale/uploaded artifacts cannot let a nonzero
          # skipped/xfailed count through unnoticed just because the two
          # sides happened to match each other. Supervisor ruling
          # 2026-09-08 extends the same items 22/26 reasoning to xpassed
          # (a stale xfail declaration) and deselected (the tally is not
          # the whole suite).
          nonzero = {
              k: {"3.11": authoritative[k], "3.12": reproduced[k]}
              for k in ("skipped", "xfailed", "xpassed", "deselected")
              if authoritative[k] != "0" or reproduced[k] != "0"
          }
          if nonzero:
              print(
                  "OPERATING_CONDITIONS.md item 22 violated (skipped == 0 "
                  "and xfailed == 0 required); item 26 extends this to "
                  "xpassed == 0 (a stale xfail declaration) and "
                  "deselected == 0 (the tally is not the whole suite):",
                  nonzero,
              )
              sys.exit(1)
          PYEOF

  doc-refs:
    # Always runs, independent of change-class -- this is exactly the check
    # a Class A (docs-only) push needs (design DEVELOPMENT_PROCESS_HYGIENE_V1.md
    # D-4). Previously a step inside `conformance` (duplicated once per
    # Python-version matrix entry, and skipped along with the rest of that
    # job whenever conformance is not required).
    name: doc-refs (document ID reference check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check document ID references (design DEVELOPMENT_PROCESS_HYGIENE_V1.md D-2)
        run: python3 tools/check_doc_refs.py

  tools-tests:
    # Phase 10 (supervisor addition, 2026-09-08): tools/tests/ was run by
    # nobody -- the root suite's `testpaths` (pyproject.toml) lists only
    # conformance-tests and the two peers' tests, and no CI job invoked it,
    # so the self-tests of check_doc_refs / check_image_pins / change_class /
    # rewrite_hash_refs only ever ran on a developer machine. Always runs
    # (independent of change-class, like doc-refs): these scripts gate every
    # push, so their own tests must too. pytest is the only dependency; the
    # scripts themselves are standard-library-only.
    name: tools-tests (self-tests of the gating scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest (pinned via constraints.txt)
        run: pip install -c constraints.txt pytest
      - name: Run tools/tests
        run: python -m pytest tools/tests -q

  scanner:
    name: public-value scan (tree mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run the public-value scanner (WP-1 CLI; no external dependency)
        run: python3 tools/public_value_scan.py

  deploy-assets-lint:
    # This job's frame (name, dependency install, single call into WP-3's
    # own lint script) was placed by WP-2; the lint script itself
    # (`r2db-api/deploy/scripts/lint_deploy_assets.sh`) and the assets it
    # lints are WP-3's own, now merged to main and used here unmodified.
    name: deploy assets lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nginx and systemd tooling
        run: sudo apt-get update && sudo apt-get install -y nginx
      - name: Lint r2db-api deploy assets (WP-3 script)
        run: bash r2db-api/deploy/scripts/lint_deploy_assets.sh --require-tools

  image-pins:
    # Always runs, independent of change-class and with no `needs` -- same
    # "a Class A push still needs this" reasoning as `doc-refs` above,
    # applied to R-19 (roadmap docs/design/ROADMAP_POST_PHASE7_V1.md
    # section 8, design D-6): the production MitateDB-api container image's
    # dependency resolution must never silently drift from the exact-pin
    # record (`constraints.txt`) the rest of this workflow's completion
    # gate installs against. Builds the image from the repository root
    # (the Dockerfile's own BUILD CONTEXT note), freezes the venv actually
    # baked into it, and diffs that freeze against `constraints.txt` with
    # `tools/check_image_pins.py` (Phase 10 WP-2).
    name: image pins match constraints.txt (R-19)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the MitateDB-api image
        run: docker build -f MitateDB-api/docker/Dockerfile -t mitatedb-api:ci .
      - name: Freeze the image's installed venv
        run: docker run --rm --entrypoint /opt/venv/bin/pip mitatedb-api:ci freeze > image-freeze.txt
      - name: Compare the image freeze against constraints.txt
        run: python3 tools/check_image_pins.py --freeze image-freeze.txt --constraints constraints.txt --require starlette --require psycopg --require uvicorn
