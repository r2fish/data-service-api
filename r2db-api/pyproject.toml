[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-service-r2db-foundation"
version = "0.1.0"
description = "Reference foundation for the common structured Data Service API contract"
requires-python = ">=3.11"
dependencies = [
    "starlette>=1.0",
    # `r2db_api.postgres`/`r2db_api.credential_store` import `psycopg`
    # unconditionally (module-level `import psycopg`), and `r2db_api.main`
    # (the `r2db_api.main:app` composition root, P2-D5) and `r2db_api.ops`
    # (the provisional CLI, P2-D6) both depend on it transitively --
    # review-reported gap: this was previously only satisfied by whatever
    # happened to already be in the development virtualenv, so a fresh
    # install following this package's own runbook (`r2db-api/docs/
    # POSTGRES_PROVISIONING_RUNBOOK.md`) hit `ModuleNotFoundError` running
    # `r2db_api.main`/`r2db_api.ops`. `[binary]` pulls in psycopg's
    # pre-built C extension (`libpq` included) rather than requiring the
    # target machine to have `libpq`'s headers/toolchain to build the pure
    # `psycopg` package from source -- the simpler default for a deployed
    # unit; an operator who specifically wants to link the system `libpq`
    # instead can install plain `psycopg` + `psycopg-c` per psycopg's own
    # documented alternative.
    "psycopg[binary]>=3.1",
    # `r2db_api.main:app` is meant to be run with `uvicorn r2db_api.main:app`
    # (P2-D5, `deploy/systemd/r2dbsvc-api.service`'s `ExecStart=`) --
    # declaring it here means `pip install` alone provides a working
    # `uvicorn` binary in this package's own virtualenv, matching what the
    # runbook's own commands assume.
    "uvicorn>=0.30",
]

[project.optional-dependencies]
test = [
    "pytest",
    "httpx>=0.28",
    "anyio>=4.0",
    # Phase 6 WP-1 addendum B (docs/work-orders/WORK_ORDER_PHASE6_CONTRACT_
    # 160_V1.md): adapter-unit parallelization for the common `conformance-
    # tests/` suite (`conftest.py`'s own `pytest_collection_modifyitems`
    # hook, `-n 5 --dist loadgroup`). Declared here, not in the repository-
    # root `pyproject.toml` -- that file carries only `[tool.pytest.ini_
    # options]` (no `[project]`/dependency section exists there at all, so
    # it cannot structurally carry a dependency declaration) -- and on BOTH
    # peers' identically-named `test` extra, mirroring `pytest`/`httpx`/
    # `anyio`'s own already-symmetric placement: this tool serves the one
    # shared `conformance-tests/` suite, not either peer specifically.
    "pytest-xdist>=3.6",
    # Phase 7 WP-6 (docs/work-orders/WORK_ORDER_PHASE7_EVIDENCE_AND_
    # PUBLICATION_V1.md, D-4(b)(iii)): starlette.testclient's `TestClient`
    # (21 call sites, 4 files, this peer only) prefers `httpx2` as its
    # first import path and falls back to `httpx` with a
    # `StarletteDeprecationWarning` when `httpx2` is absent. Declared on
    # BOTH peers' identically-named `test` extra (mirroring this file's own
    # already-symmetric placement of `pytest`/`httpx`/`anyio`/
    # `pytest-xdist`) even though MitateDB-api's own tests do not import
    # `starlette.testclient` today. `StarletteDeprecationWarning` is a
    # `UserWarning` subclass, not a `DeprecationWarning`, so root
    # `pyproject.toml`'s `filterwarnings = ["error::DeprecationWarning",
    # ...]` (D-4(b)(iii)) was never going to catch the httpx fallback
    # warning either way; `httpx2`'s actual role here is to keep that
    # upstream fallback warning out of the warnings summary, to cover the
    # `RuntimeError` Starlette raises if a future release drops the
    # `httpx` fallback path outright, and to keep both peers' `[test]`
    # extras symmetric. Evidence (wheel METADATA): `Author-email: Tom
    # Christie`, `Maintainer-email: "Pydantic
    # Services Inc."`, `Homepage: https://
    # github.com/pydantic/httpx2`; Starlette 1.6.0's own `testclient.py`
    # imports `httpx2` as its first import path.
    "httpx2>=2.12",
]

[tool.setuptools.package-data]
# Packaged copy of the common contract (see r2db_api/http.py's contract
# loader comment): ships inside this distribution so a deployed unit is
# self-contained without the sibling spec/ checkout (docs/design/
# R2DB_SERVICE_LAYER_ARCHITECTURE.md §5.3, C-1).
r2db_api = ["contract/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
anyio_mode = "auto"
# Phase 7 WP-6 (D-4(b)(iii)): identical 2 lines on root pyproject.toml,
# r2db-api/pyproject.toml and MitateDB-api/pyproject.toml -- pinned equal
# by conformance-tests/test_pytest_config_symmetry.py. The `ignore` entry
# is scoped to the single known upstream warning (starlette.testclient's
# own module-level `anyio.abc.BlockingPortal` alias access, emitted once
# at import time regardless of `httpx2`'s presence); every other
# DeprecationWarning still fails the suite.
filterwarnings = ["error::DeprecationWarning", "ignore:.*BlockingPortal.*:DeprecationWarning:starlette.testclient"]
