[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-service-mitatedb-foundation"
version = "0.1.0"
description = "Reference foundation for the common structured Data Service API contract (MitateDB-api)"
requires-python = ">=3.11"
dependencies = [
    # Application-plane/control-plane ASGI apps (WP-3/WP-4, not yet built
    # in WP-1) will be Starlette apps, matching r2db-api's own stack
    # choice (design v1.1 D-B: same execution-environment parts, no code
    # sharing between the two peers).
    "starlette>=1.0",
    # `mitatedb_api.backend_postgres` imports `psycopg` unconditionally
    # (module-level `import psycopg`), and the package `__init__.py`
    # imports that module eagerly too -- so a fresh install following this
    # package's own runbook needs it present from the start, the same
    # review-reported gap r2db-api's own pyproject.toml already documents
    # fixing for itself. `[binary]` pulls in psycopg's pre-built C
    # extension (`libpq` included) rather than requiring the target
    # machine to have `libpq`'s headers/toolchain to build the pure
    # `psycopg` package from source.
    "psycopg[binary]>=3.1",
    # The eventual HTTP composition (WP-3) is meant to run with `uvicorn
    # mitatedb_api.main:app`; declaring it here means `pip install` alone
    # provides a working `uvicorn` binary in this package's own
    # virtualenv.
    "uvicorn>=0.30",
]

[project.optional-dependencies]
test = [
    "pytest",
    "httpx>=0.28",
    "anyio>=4.0",
    # Phase 6 WP-1 addendum B -- mirrors r2db-api/pyproject.toml's
    # identically-named extra and its own identical comment.
    "pytest-xdist>=3.6",
    # Phase 7 WP-6 -- mirrors r2db-api/pyproject.toml's identically-named
    # extra and its own identical comment (this peer's own tests do not
    # import `starlette.testclient` today; declared here anyway to keep
    # both peers' `[test]` extras symmetric. `StarletteDeprecationWarning`
    # is a `UserWarning` subclass, not a `DeprecationWarning`, so root
    # `pyproject.toml`'s `filterwarnings = ["error::DeprecationWarning",
    # ...]` was never at risk of failing this peer's collection over the
    # httpx fallback warning either way; `httpx2`'s actual role is to keep
    # that upstream fallback warning out of the warnings summary and to
    # cover the `RuntimeError` Starlette raises if a future release drops
    # the `httpx` fallback path outright).
    "httpx2>=2.12",
]

[tool.setuptools.package-data]
# Packaged copy of the common contract (Phase 6 WP-0, design D-4(b); see
# mitatedb_api/http.py's contract loader comment): ships inside this
# distribution so a deployed unit is self-contained without the sibling
# spec/ checkout, mirroring r2db-api's own pyproject.toml identically-named
# section.
mitatedb_api = ["contract/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Phase 7 WP-6 -- identical 2 lines on root pyproject.toml, r2db-api/
# pyproject.toml and this file, pinned equal by conformance-tests/
# test_pytest_config_symmetry.py. See r2db-api/pyproject.toml's own
# identically-named section for the rationale.
filterwarnings = ["error::DeprecationWarning", "ignore:.*BlockingPortal.*:DeprecationWarning:starlette.testclient"]
